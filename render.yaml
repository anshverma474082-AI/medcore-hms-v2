services:
  - type: keyvalue
    name: medcore-hms-redis
    plan: free
    region: oregon
    ipAllowList: []
    persistenceMode: off
    maxmemoryPolicy: noeviction

  - type: web
    name: medcore-hms-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: medcore-hms-redis
          type: keyvalue
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: CLINICAL_ENCRYPTION_KEY
        generateValue: true
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: COOKIE_SECURE
        value: "true"
      - key: FRONTEND_ORIGINS
        fromService:
          name: medcore-hms-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: DEMO_PASSWORD
        value: "DemoPass123!"

  - type: web
    name: medcore-hms-web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile.web
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /
    envVars:
      - key: API_INTERNAL_URL
        value: https://medcore-hms-api-sfzz.onrender.com
