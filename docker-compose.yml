services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: medcore, POSTGRES_USER: medcore, POSTGRES_PASSWORD: medcore }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://medcore:medcore@postgres:5432/medcore
    depends_on: [postgres, redis]
    ports: ["8000:8000"]
volumes:
  pgdata:
